<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Tab-Hopper · the daily click-through</title>
<meta name="description" content="A daily physics puzzle on a web page drowning in pop-ups. Three clicks, one bouncy ball.">
<meta name="theme-color" content="#2b44ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%232b44ff'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ff4f8b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sites.css">
<style>
:root{--ink:#17131f;--paper:#fbf8f1;--link:#2b44ff;--visited:#6a2bd9;--hot:#ff4f8b;--sun:#ffd23f;--mint:#2fd39a;--mute:#5d5670;--acc:var(--link)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--visited) linear-gradient(var(--link),var(--visited) 60%,#2a1650) fixed;background-size:cover;image-rendering:pixelated;color:var(--ink);font:13px/1.45 "Space Mono",ui-monospace,monospace;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
.px{shape-rendering:crispEdges;display:block}
.pf{font-family:"Pixelify Sans",monospace}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;height:48px;background:var(--paper);border-bottom:2px solid var(--ink)}
.sq{width:50px;flex:none;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq:first-child{border-right:2px solid var(--ink)}.sq:last-child{border-left:2px solid var(--ink)}
.sq:hover{background:#efeaff}
.top .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:2px;font-size:11px;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.top .mid b{font:700 15px "Pixelify Sans",monospace;letter-spacing:.5px}
#menu{position:fixed;top:56px;left:8px;z-index:35;width:220px}
#menu[hidden]{display:none}
#menu button{display:block;width:100%;text-align:left;border:0;border-top:2px solid var(--ink);background:var(--paper);padding:10px 12px;font:700 11px "Space Mono",monospace;letter-spacing:1.5px;cursor:pointer}
#menu button:hover{background:var(--sun)}

/* pixel windows (cards) */
.win{background:var(--paper);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.tbar{height:22px;background:var(--acc);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px;padding:0 7px;color:#fff;font:700 9.5px "Space Mono",monospace;letter-spacing:1.2px}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border:1.5px solid var(--ink);display:block}
.dots i:nth-child(1){background:var(--hot)}.dots i:nth-child(2){background:var(--sun)}.dots i:nth-child(3){background:var(--mint)}

/* home */
[hidden]{display:none!important}
#home{position:relative;max-width:460px;margin:0 auto;padding:26px 16px 40px;display:flex;flex-direction:column;gap:22px}
.hero{position:relative;z-index:1}
.hero-in{padding:20px 18px 18px;text-align:center}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--mute)}
.logo{margin:10px 0 6px;font:700 clamp(40px,12vw,58px)/.9 "Pixelify Sans",monospace;letter-spacing:-1px;display:inline-flex;align-items:flex-end;gap:6px}
.logo .u{text-decoration:underline;text-decoration-color:var(--link);text-decoration-thickness:5px;text-underline-offset:7px;color:var(--ink);animation:visit 5s steps(1) infinite}
@keyframes visit{0%,70%{text-decoration-color:var(--link)}71%,100%{text-decoration-color:var(--visited)}}
.logo .cur{width:22px;margin-bottom:-12px;animation:nudge 1.4s steps(2) infinite}
@keyframes nudge{50%{transform:translate(3px,3px)}}
.rule{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--link);font-weight:700;font-size:10px;letter-spacing:3px}
.rule::before,.rule::after{content:"";flex:1;height:6px;border-top:2px solid var(--link);border-bottom:2px solid var(--link)}
.tagline{margin:0;font-size:13px}
.start{position:relative;z-index:1;padding:14px 16px 16px}
.row1{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:2px;font-weight:700}
.lnk{border:0;background:none;padding:0 0 1px;border-bottom:2px solid var(--ink);font:700 10.5px "Space Mono",monospace;letter-spacing:2px;cursor:pointer}
.siterow{margin:12px 0;border:2px solid var(--ink);display:flex;align-items:center;gap:10px;padding:9px 10px;background:#fff}
.siterow .fav{width:22px;height:22px;flex:none;background:var(--acc);border:2px solid var(--ink)}
.siterow .host{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siterow .par{font:700 13px "Pixelify Sans",monospace;background:var(--sun);border:2px solid var(--ink);padding:0 6px}
.cta{width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:15px 10px;font:700 17px "Pixelify Sans",monospace;letter-spacing:2px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--paper)}
.cta:hover{background:#2d2540}
.cta:active{transform:translate(2px,2px)}
.fine{margin:10px 0 0;text-align:center;font-size:9.5px;letter-spacing:1.6px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ghost{border:2px solid var(--ink);background:var(--paper);padding:10px 6px;font:700 10.5px "Space Mono",monospace;letter-spacing:1.5px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.ghost:hover{background:var(--sun)}
.ghost:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.floaters{position:absolute;inset:0;pointer-events:none;z-index:0}
.fl{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);animation:bob 6s ease-in-out infinite}
.fl b{display:block;height:8px;background:var(--hot);border-bottom:2px solid var(--ink)}
@keyframes bob{50%{transform:translateY(-10px) rotate(var(--r,2deg))}}

/* game */
#game{overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:12px 12px 14px;gap:12px}
.bwin{position:relative}
.chrome{min-width:0;overflow:hidden;height:30px;display:flex;align-items:center;gap:8px;padding:0 7px;background:var(--acc);border-bottom:2px solid var(--ink)}
.url{flex:1;min-width:0;height:18px;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10px;white-space:nowrap;overflow:hidden}
.coinct{flex:none;display:flex;align-items:center;gap:4px;height:18px;background:var(--sun);border:2px solid var(--ink);padding:0 5px;font:700 11px/1 "Pixelify Sans",monospace}
.coinct .px{width:10px}
.coinct.pop{animation:cpop .3s steps(3)}
@keyframes cpop{50%{transform:scale(1.25)}}
.url .host{font-weight:700}.url .path{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
#viewport{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--paper)}
#page{position:absolute;left:0;top:0;width:360px;height:560px;transform-origin:0 0}
#fx{position:absolute;left:0;top:0;width:360px;height:560px;pointer-events:none;z-index:20;image-rendering:pixelated}
.dock{display:flex;gap:8px;align-items:stretch}
.dk{width:48px;flex:none;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 0;font:700 18px/1 "Pixelify Sans",monospace}
.dk small{font:700 8px "Space Mono",monospace;letter-spacing:1px}
.dk:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.dk.on{background:var(--hot)}
.dk:disabled{opacity:.5}
.meter{flex:none;min-width:0;border:2px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 8px;gap:3px}
.pips{display:flex;gap:4px}
.pips{gap:2px}.pips .px{width:9px;transition:opacity .2s}
.pips .used{opacity:.18}
.meter small{font:700 8px "Space Mono",monospace;letter-spacing:1px;white-space:nowrap}
.meter.deny{animation:deny .3s steps(4)}
@keyframes deny{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.launch{flex:1;min-width:0;width:auto;background:var(--hot);color:var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:clamp(13px,4.2vw,17px);letter-spacing:1px;padding:0 6px;white-space:nowrap}
.launch:hover{background:#ff6fa0}
.launch:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.launch:disabled{opacity:.5;cursor:default}
.status{min-height:24px;text-align:center}
.status span{display:inline-block;background:var(--ink);color:var(--paper);padding:3px 10px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.status span.good{background:var(--mint);color:var(--ink);border:2px solid var(--ink)}

/* goal: a new tab to hop into */
#goal{position:absolute;background:var(--mint);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 7.5px "Space Mono",monospace;letter-spacing:1px;z-index:1}
#goal .px{width:16px}
#goal::after{content:"";position:absolute;inset:-7px;border:2px dashed var(--ink);animation:march 1.2s steps(2) infinite}
@keyframes march{50%{inset:-5px;border-color:var(--mint)}}
#goal.locked{background:#ddd7ea;color:var(--mute)}
#goal.locked::after{display:none}
#goal.unlock{animation:unl .5s steps(4)}
@keyframes unl{25%,75%{background:var(--sun)}50%{background:var(--mint)}}
#goal.opened{background:var(--sun);animation:opened .5s steps(3) forwards}
@keyframes opened{50%{transform:scale(1.2)}100%{transform:scale(1.08)}}

/* clutter: the solid stuff, as pixel UI */
.el{position:absolute;z-index:3}
.el-in{width:100%;height:100%;position:relative;transition:transform .45s cubic-bezier(.25,1.9,.45,1)}
.el.drag{z-index:15;cursor:grabbing}
.el.drag .el-in{transition:none}
.draggable{cursor:grab}
.el.drop .el-in{animation:drop .45s cubic-bezier(.3,1.7,.45,1)}
@keyframes drop{0%{transform:scale(1.08)}35%{transform:scale(.94,1.04)}100%{transform:scale(1)}}
.el.wob .el-in{animation:wob .3s steps(3)}
@keyframes wob{33%{transform:translate(1px,-1px)}66%{transform:translate(-1px,1px)}}
.el.back{transition:left .35s cubic-bezier(.3,1.6,.5,1),top .35s cubic-bezier(.3,1.6,.5,1)}
.x-btn{position:absolute;right:3px;top:2px;width:12px;height:12px;border:1.5px solid var(--ink);background:var(--paper);padding:0;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.x-btn .px{width:6px}
.x-btn::after{content:"";position:absolute;inset:-10px}
.note .el-in{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:600 13px/22px "Pixelify Sans",monospace;padding:0 8px;white-space:nowrap;overflow:hidden}
.note.h0 .el-in{background:var(--sun)}.note.h1 .el-in{background:#ffb3cf}.note.h2 .el-in{background:#b5f2d8}.note.h3 .el-in{background:#cdd4ff}
.toast .el-in{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;gap:6px;padding:0 6px;overflow:hidden}
.toast .ti{width:18px;height:18px;flex:none;background:var(--acc);border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 10px "Pixelify Sans",monospace;color:#fff}
.toast .tw{min-width:0}
.toast .tt2{font:700 9px/1.1 "Pixelify Sans",monospace;white-space:nowrap}
.toast .tb2{font:7px/1.2 "Space Mono",monospace;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub .el-in{background:var(--hot);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:700 11px/26px "Pixelify Sans",monospace;text-align:center;letter-spacing:.8px}
.sub.pressed .el-in{background:#ffa3c4;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);transition:none}
.popup{z-index:4}
.popup .el-in{background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);overflow:hidden}
.pp-t{height:16px;background:var(--acc);border-bottom:2px solid var(--ink);color:#fff;font:700 7px/14px "Space Mono",monospace;letter-spacing:1px;padding:0 5px;white-space:nowrap;overflow:hidden}
.pp-c{padding:6px 8px}
.pp-h{font:700 11.5px/1.05 "Pixelify Sans",monospace}
.pp-b{font-size:7.5px;line-height:1.35;color:var(--mute);margin-top:3px}
.pp-f{display:flex;margin-top:5px;height:16px;border:1.5px solid var(--ink)}
.pp-in{flex:1;font-size:7px;color:#9a92b0;padding:2px 4px;white-space:nowrap;overflow:hidden;background:#fff}
.pp-cta{background:var(--ink);color:var(--paper);font:700 8.5px/13px "Pixelify Sans",monospace;padding:0 6px;white-space:nowrap}
.pp-no{font-size:7px;text-decoration:underline;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad{z-index:2}
.ad .el-in{background:var(--sun);background-image:repeating-conic-gradient(#0000 0 25%,#17131f14 0 50%);background-size:4px 4px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:14px 5px 4px;overflow:hidden}
.ad .al{position:absolute;left:4px;top:3px;font:700 6.5px "Space Mono",monospace;letter-spacing:1px;background:var(--ink);color:var(--sun);padding:0 3px}
.ad .ar{display:flex;gap:5px;height:100%}
.ad .ath{width:38px;flex:none;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 20px "Pixelify Sans",monospace;color:#fff;background:var(--acc);background-image:repeating-conic-gradient(#0000 0 25%,#ffffff33 0 50%);background-size:4px 4px}
.ad .ah{font:700 9px/1.05 "Pixelify Sans",monospace;text-transform:uppercase}
.ad .as{font-size:6.5px;margin-top:2px}
.cookie{z-index:6}
.cookie .el-in{background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:8px;padding:0 10px}
.ck-t{flex:1;font-size:7px;line-height:1.35;color:#d6d0e6}
.ck-t b{display:block;font:700 11px "Pixelify Sans",monospace;color:var(--sun);margin-bottom:1px}
.ck-b{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.ck-m{font-size:6.5px;text-decoration:underline;color:#d6d0e6}
.accept{border:2px solid var(--paper);background:var(--sun);color:var(--ink);font:700 10px "Pixelify Sans",monospace;padding:3px 8px;cursor:pointer;box-shadow:2px 2px 0 var(--paper)}
.chat{z-index:7}
.bubble{position:absolute;left:0;top:0;width:44px;height:44px;background:var(--acc);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;font:700 16px "Pixelify Sans",monospace;color:#fff;letter-spacing:1px}
.bubble::after{content:"1";position:absolute;right:-6px;top:-6px;width:14px;height:14px;background:var(--hot);border:1.5px solid var(--ink);color:var(--ink);font:700 9px/11px "Pixelify Sans",monospace;text-align:center}
.chat.open .bubble::after{display:none}
.panel{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);transform:scale(0);transform-origin:90% 100%;transition:transform .4s cubic-bezier(.3,1.6,.5,1);overflow:hidden;font-size:7.5px;line-height:1.35}
.chat.open .panel{transform:scale(1)}
.panel .ph{background:var(--acc);color:#fff;padding:5px 7px;border-bottom:2px solid var(--ink)}
.panel .ph b{display:block;font:700 10px "Pixelify Sans",monospace}
.panel .ph span{font-size:6.5px;opacity:.9}
.panel .msg{margin:6px 7px 0;padding:4px 6px;border:1.5px solid var(--ink);background:#fff;max-width:88%}
.panel .msg.me{margin-left:auto;background:var(--acc);color:#fff}
.panel .inp{position:absolute;left:7px;right:7px;bottom:6px;border:1.5px solid var(--ink);padding:3px 6px;color:#9a92b0;background:#fff}
#els.reveal .el-in,#els.reveal .bubble,#els.reveal .chat.open .panel{outline:2px dashed var(--hot);outline-offset:3px;animation:rv .5s steps(1) infinite alternate}
@keyframes rv{to{outline-color:var(--ink)}}
.el.fold .el-in{animation:fold .3s steps(4) forwards;transform-origin:50% 0}
@keyframes fold{to{transform:scaleY(0);opacity:0}}
.el.shrink .el-in{animation:shrink .3s steps(4) forwards;transform-origin:100% 0}
@keyframes shrink{to{transform:scale(0);opacity:0}}
.el.slide .el-in{animation:slide .35s steps(5) forwards}
@keyframes slide{to{transform:translateY(80px);opacity:0}}

/* landscape: scenery either side of the puzzle column */
#side{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--paper)}
#side .sw-band{position:absolute;left:0;right:0;top:0;height:30px;background:var(--acc);border-bottom:2px solid var(--ink)}
#side .sw-col{position:absolute;top:58px;display:flex;flex-direction:column;gap:8px;font:9px/1.35 "Space Mono",monospace;color:var(--mute)}
#side .sw-col b{font:700 11px "Pixelify Sans",monospace;color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:3px}
#side .sw-col i{font:700 12px "Pixelify Sans",monospace;color:var(--acc);margin-right:5px;font-style:normal}
#viewport.land #page{box-shadow:0 0 0 2px var(--ink),0 0 0 3000px #17131f47}
/* home extras */
.hstat{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;min-height:14px}
.hstat b{color:var(--ink)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.row3 .ghost{padding:10px 2px;font-size:9.5px;letter-spacing:1px}
/* results / stats / archive extras */
.gline{text-align:center;font-size:11px;line-height:1.5;margin:-4px 0 10px;color:var(--mute)}
.gline:empty{display:none}
.gline b{color:var(--ink)}
.wide{width:100%;margin-top:10px}
.nextp{text-align:center;margin-top:12px;font-size:10px;letter-spacing:2px;color:var(--mute)}
.nextp b{font:700 16px "Pixelify Sans",monospace;letter-spacing:1px;color:var(--ink)}
.mlinks{display:flex;justify-content:center;gap:18px;margin-top:12px}
.mlinks a{font-size:10.5px;font-weight:700;letter-spacing:1.5px;border-bottom:2px solid var(--ink);cursor:pointer}
.stats.four{grid-template-columns:repeat(4,1fr)}.stats.four b{font-size:19px}
.hist{margin:6px 0 12px;display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;align-items:center;gap:6px;font:700 10px "Space Mono",monospace}
.hrow span{width:28px;text-align:right}
.hrow i{font-style:normal;background:#cfc8e8;border:2px solid var(--ink);padding:0 5px;text-align:right;color:var(--ink)}
.hrow i.me{background:var(--hot)}
.alist{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px;max-height:50vh;overflow:auto}
.arow{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;border:2px solid var(--ink);background:#fff;padding:7px 8px;font:11px "Space Mono",monospace;text-align:left;cursor:pointer}
.arow:hover{background:var(--sun)}
.arow b{font:700 13px "Pixelify Sans",monospace}.arow em{font-style:normal;font-size:9px;letter-spacing:1px}.arow i{font-style:normal;font-weight:700}
.empty{font-size:12px;color:var(--mute);text-align:center;margin:10px 0}
/* modal window */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#17131f99}
#modal[hidden]{display:none}
.mwin{width:min(380px,100%);max-height:calc(100vh - 32px);overflow:auto;animation:pop .3s steps(3)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mbody{padding:16px 16px 14px}
.mbody h2{margin:4px 0 6px;font:700 28px/1 "Pixelify Sans",monospace}
.mbody .eyebrow{text-align:left}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);margin:12px 0}
.stats div{padding:7px 4px;text-align:center;border-left:2px solid var(--ink)}.stats div:first-child{border-left:0}
.stats b{display:block;font:700 22px/1 "Pixelify Sans",monospace}
.stats small{font-size:8.5px;letter-spacing:1.2px;color:var(--mute)}
.sharebox{background:#fff;border:2px dashed var(--ink);padding:8px 10px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.mrow{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:12px}
.mrow .cta{padding:11px 6px;font-size:14px}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;margin:0 0 9px;font-size:12px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;background:var(--sun);border:2px solid var(--ink);font:700 13px/18px "Pixelify Sans",monospace;text-align:center}

<body>
<header class="top">
  <button class="sq" id="menuBtn" aria-label="Menu"></button>
  <div class="mid"><b>TAB-HOPPER</b><span id="topNum">#1 · NOV 18</span></div>

</div>

<section id="home" class="screen">
  <div class="floaters" aria-hidden="true">
    <div class="fl" style="left:-6px;top:30px;width:70px;height:52px;--r:-3deg"><b></b></div>
    <div class="fl" style="right:-4px;top:200px;width:58px;height:40px;animation-delay:-2s"><b style="background:var(--sun)"></b></div>
    <div class="fl" style="left:4px;bottom:120px;width:46px;height:36px;animation-delay:-4s;--r:4deg"><b style="background:var(--mint)"></b></div>
  </div>
  <div class="win hero">
    <div class="tbar"><span class="dots"><i></i><i></i><i></i></span>welcome.html</div>
    <div class="hero-in">
      <div class="eyebrow">A NEW MESS EVERY DAY</div>
      <div class="logo"><span class="u">TAB-HOPPER</span><span id="logoCur"></span></div>
      <div class="rule">THE DAILY CLICK-THROUGH</div>
      <p class="tagline">Six moves. One bouncy ball.<br>Grab the coins, hop the tab.</p>
    </div>
  </div>
  <div class="win start">
    <div class="row1"><span id="todayLbl">TODAY</span><button class="lnk" id="howBtn">HOW TO PLAY ↗</button></div>
    <div class="siterow"><span class="fav" id="hFav"></span><span class="host" id="hHost">…</span><span class="par" id="hPar">–</span></div>
    <div class="fine" id="hInfo"></div>
    <button class="cta" id="openBtn">▶ PLAY TODAY</button>
    <div class="fine hstat"><span id="hStreak"></span><span id="hNext" hidden>NEXT PAGE IN <b class="cd">--:--:--</b></span><span id="hPlayers"></span></div>
    <div class="row3"><button class="ghost" id="statsBtn">STATS</button><button class="ghost" id="archiveBtn">ARCHIVE</button><button class="ghost" id="practiceBtn">PRACTICE ∞</button></div>
  </div>
</section>

<section id="game" class="screen" hidden>
  <div class="win bwin" id="bwin">
    <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url"><span id="lock"></span><span class="host" id="host"></span><span class="path" id="path"></span></span><span class="coinct" id="coinCt"></span></div>
    <div id="viewport"><div id="side" hidden></div><div id="page">
      <div id="decor"></div>
      <div id="goal"><span id="goalIco"></span><span id="goalTxt">NEW TAB</span></div>
      <div id="els"></div>
      <canvas id="fx" width="180" height="280"></canvas>
    </div></div>
  </div>

    <button class="dk" id="reset" title="Put everything back">↺<small>RESET</small></button>
    <div class="meter" id="meter"><span class="pips" id="pips"></span><small id="meterTxt">6 MOVES</small></div>

  </div>

<div id="modal" hidden></div>

<script>
(() => {
const S=window.TabSim,QS=new URLSearchParams(location.search);
// One puzzle for everyone. Phones show it as a portrait page; desktops and tablets as a landscape page
// with the puzzle as the centre column (picked by screen size so rotating mid-game changes nothing).
const LAND=QS.get('layout')==='portrait'?false:QS.get('layout')==='landscape'?true:Math.min(screen.width,screen.height)>=600;
const WD=S.WORLDS.portrait,LEVELS=window.TAB_LEVELS||[],SITES=window.TAB_SITES,ADS=window.TAB_ADS,TOASTS=window.TAB_TOASTS,NOTES=window.TAB_NOTES;
// Optional global stats server (server/worker.js). Leave empty to hide "how everyone did".
const STATS_API='';
const $=id=>document.getElementById(id);
const INK='#17131f',PAPER='#fbf8f1',LINK='#2b44ff',VISITED='#6a2bd9',HOT='#ff4f8b',SUN='#ffd23f',MINT='#2fd39a';
const ACC={news:LINK,recipe:HOT,forum:VISITED,shop:'#ff8a00',tech:MINT};
const viewport=$('viewport'),page=$('page'),elsBox=$('els'),cv=$('fx'),ctx=cv.getContext('2d');
cv.width=WD.W/2;cv.height=WD.H/2;ctx.imageSmoothingEnabled=false;
page.style.width=cv.style.width=WD.W+'px';page.style.height=cv.style.height=WD.H+'px';viewport.classList.toggle('land',LAND);
const MAX_ACTIONS=6,DRAGGABLE=new Set(['note','toast','sub','popup']);
const ICON={note:'🗒️',toast:'🔔',sub:'🔴',popup:'🪟',close:'❌',cookie:'🍪',chat:'💬'};

/* ---------- pixel icons ---------- */
function pix(rows,map,cls='px'){const h=rows.length,w=rows[0].length;let r='';
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(map[ch])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${map[ch]}"/>`}));
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w*2}" height="${h*2}">${r}</svg>`}
const P={
  cursor:['#.......','##......','#o#.....','#oo#....','#ooo#...','#oooo#..','#ooooo#.','#oo####.','#o#.....','##......','#.......'],
  x:['#...#','.#.#.','..#..','.#.#.','#...#'],
  flag:['#ppp....','#ppppp..','#ppppppp','#ppppp..','#ppp....','#.......','#.......','#.......','#.......'],
  lock:['.###.','#...#','#...#','#####','##.##','#####'],
  coin:['..###..','.#yyy#.','#yy#yy#','#yy#yy#','#yy#yy#','.#yyy#.','..###..'],
  menu:['#######','.......','#######','.......','#######'],
  snd:['....#....','...##..#.','#####...#','#####.#.#','#####.#.#','#####...#','...##..#.','....#....'],
  mute:['....#....','...##....','#####.#.#','#####..#.','#####.#.#','#####....','...##....','....#....']
};
const ink={'#':INK,o:'#fff',p:HOT};

/* ---------- audio ---------- */
let ac=null,muted=false;try{muted=localStorage.getItem('th-muted')==='1'}catch(e){}
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,d=.1,type='sine',v=.12,when=0,slide=0){const a=A();if(!a||muted)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.03)}
function noise(d=.08,v=.2,when=0,type='bandpass',freq=1800){const a=A();if(!a||muted)return;const t=a.currentTime+when,len=Math.max(1,a.sampleRate*d|0),b=a.createBuffer(1,len,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len)**2;const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type=type;fl.frequency.value=freq;g.gain.value=v;s.connect(fl).connect(g).connect(a.destination);s.start(t)}
const PITCH={note:330,toast:260,popup:200,ad:300,cookie:180,chat:420,panel:240};
const sfx={
  pick:()=>tone(620,.05,'square',.04),
  drop:()=>{tone(150,.18,'square',.08,0,.5);noise(.05,.1,0,'lowpass',600)},
  thwip:()=>{tone(260,.12,'square',.05,0,4)},
  crunch:()=>{for(let i=0;i<3;i++)noise(.05,.3,i*.07,'bandpass',1200+i*500)},
  bloop:o=>tone(o?420:640,.12,'square',.06,0,o?1.7:.6),
  thock:(t,v)=>tone(PITCH[t]||250,.06,'square',Math.min(.08,v/5000)),
  clack:()=>{tone(2600,.018,'square',.05);noise(.035,.35,0,'highpass',3000);tone(140,.05,'sine',.15)},
  deny:()=>tone(130,.14,'square',.05),
  launch:()=>{tone(440,.06,'square',.06);tone(880,.1,'square',.05,.06)},
  coin:k=>{const f=Math.pow(2,k*2/12);tone(988*f,.05,'square',.05);tone(1319*f,.14,'square',.05,.05)},
  unlock:()=>[0,7,12].forEach((s,i)=>tone(660*Math.pow(2,s/12),.1,'square',.05,i*.06)),
  win:()=>[0,4,7,12,16].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),.18,'square',.06,i*.08)),
  fail:()=>tone(300,.4,'square',.05,0,.4)
};

/* ---------- dithered wallpaper ---------- */
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
(function wallpaper(){try{const w=120,h=200,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),stops=[LINK,VISITED,'#2a1650'].map(rgb);
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){const t=Math.min(1.999,Math.max(0,(y/h)*2+Math.sin(i/w*5+y/40)*.08)),b=Math.floor(t),f=t-b,th=(BAY[(y&3)*4+(i&3)]+.5)/16,col=stops[f>th?b+1:b],o=(y*w+i)*4;im.data[o]=col[0];im.data[o+1]=col[1];im.data[o+2]=col[2];im.data[o+3]=255}
  x.putImageData(im,0,0);document.body.style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}})();

/* ---------- the daily schedule ---------- */
const EPOCH=Date.UTC(2026,10,18);   // #1 = Wednesday 18 November 2026
function dayNum(d=new Date()){return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1}
const num=dayNum();
const DOW=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'],MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const dowOf=d=>((2+d)%7+7)%7;                       // day 1 is a Wednesday
const fmtDate=d=>{const x=new Date(EPOCH+(d-1)*864e5);return MON[x.getUTCMonth()]+' '+x.getUTCDate()};
// difficulty (number of breaks) and theme for each weekday: easy Monday ... brutal Sunday
const DIFF=[5,2,2,3,3,4,4],DIFFN={2:'EASY',3:'MEDIUM',4:'HARD',5:'BRUTAL'};
const DAYTHEME=['space','kitchen','roof','web','space','kitchen','roof'];
const THEMES=window.TAB_THEMES||{},ORDER=window.TAB_THEME_ORDER||['web'];
const POOLS={};LEVELS.forEach((l,i)=>(POOLS[l.par]=POOLS[l.par]||[]).push(i));
function daySpec(d){
  const w=dowOf(d),k=DIFF[w],th=DAYTHEME[w];let same=0,webs=0;
  for(let x=1;x<d;x++){const wx=dowOf(x);if(DIFF[wx]===k)same++;if(DAYTHEME[wx]==='web')webs++}
  const pool=POOLS[k]||POOLS[3]||[0];
  return {d,idx:pool[same%pool.length],theme:th,site:webs,k,dow:w}}
const TODAY=daySpec(num);
const cap=w=>w[0]+w.slice(1).toLowerCase();
function dayTitle(s){return s.theme==='web'?'Web Wednesday':cap(DOW[s.dow])+' · '+THEMES[s.theme].name}
const DAYTXT=`#${num} · ${DOW[TODAY.dow].slice(0,3)} ${fmtDate(num)}`;
const WEBN={drag:'notes, notifications, buttons and pop-ups',close:'close ✕ ads and pop-ups',accept:'accept cookies',toggle:'open or shut the chat'};

/* ---------- state ---------- */
const DAILY_LAUNCHES=3;
let mode='daily',day=num,idx=0,theme=TODAY.theme,siteIdx=TODAY.site,level,els,used=0,history=[],launches=0,running=false,won=false,views=[],scale=1,site=SITES[0];
let runs=[],gotMask=0,best=-1,dayDone=false,demo=null,saved=null;
const pc=m=>{let c=0;while(m){m&=m-1;c++}return c};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const dayKey=d=>'th4-day-'+d;
function saveDay(){if(mode==='daily')store.set(dayKey(num),{els,used,launches,runs,best,done:dayDone})}
function streakNow(){const st=store.get('th4-stats');return st&&(st.last===num||st.last===num-1)?st.streak:0}

/* ---------- screens ---------- */
function show(id){$('home').hidden=id!=='home';$('game').hidden=id!=='game';$('menu').hidden=true;if(id==='game')fit();else $('topNum').textContent=DAYTXT;scrollTo(0,0)}
function homeCard(){
  const s=TODAY,T=THEMES[s.theme],web=s.theme==='web',st=SITES[s.site%SITES.length],L=LEVELS[s.idx],rec=store.get(dayKey(num));
  $('hFav').style.background=web?ACC[st.id]:T.acc;$('hHost').textContent=web?st.host:T.name;$('hPar').textContent=DIFFN[s.k];
  $('todayLbl').textContent=(web?'WEB WEDNESDAY':DOW[s.dow])+' · #'+num;
  $('hInfo').textContent=(L?L.coins.length:0)+' COINS · 6 MOVES · 3 LAUNCHES';
  const k=streakNow();$('hStreak').textContent=k?`STREAK ${k} 🔥`:'';
  const done=rec&&rec.done;$('hNext').hidden=!done;
  $('openBtn').textContent=done?`✓ DONE · ${Math.max(0,rec.best)*100} PTS`:rec&&rec.launches?`▶ CONTINUE · ${DAILY_LAUNCHES-rec.launches} LEFT`:'▶ PLAY TODAY';
  globalCount();
}
/* ---------- the website inside the window ---------- */
function decor(){
  const T=THEMES[theme],web=theme==='web';
  site=SITES[siteIdx%SITES.length];
  const acc=web?ACC[site.id]:T.acc;page.className='th-'+theme;
  $('decor').innerHTML=web?site.html:(LAND?'':T.scene(WD.W,WD.H));$('decor').style.background=LAND&&!web?'transparent':'';
  [page,$('bwin'),$('modal'),$('side')].forEach(x=>x.style.setProperty('--acc',acc));
  $('host').textContent=web?site.host:T.place;$('path').textContent=web?site.path:'';$('lock').hidden=!web;
  const g=$('goal'),G=WD.GOAL;g.style.left=G.x+'px';g.style.top=G.y+'px';g.style.width=G.w+'px';g.style.height=G.h+'px';
  dither(acc,web?null:T.pal,$('decor'));sideKey='';
}
// landscape: scenery either side of the puzzle column (non-solid; the column edges are the walls)
const SIDE={news:{l:['World','UK','Politics','Business','Tech','Science','Sport','Culture'],r:['Pigeon elected to parish council','Man still on hold, day 3','Is your toaster listening?','The quiet rise of the spork']},
  recipe:{l:['Cakes','Bread','Dinners','Puddings','Nan’s tins','About me'],r:['Lemon drizzle (again)','Scones that won’t judge you','Why Nan hid the salt','One-bowl brownies']},
  forum:{l:['General Chat','Kettle Talk','Descaling','Buy & Sell','Off Topic','Site News'],r:['Is a whistle a feature?','Post your kettle','Limescale: friend or foe','Rate my teaspoon']},
  shop:{l:['Kitchen','Garden','Gadgets','Fruit Storage','Deals','Basket (3)'],r:['Inflatable fruit bowl','Self-stirring mug','Banana slicer XL','Spork, set of 40']},
  tech:{l:['Reviews','Deals','How-to','Podcast','Phones','Laptops'],r:['Every charger, ranked','Do you need 9 cameras?','The toaster that tweets','Cases: the sequel']}};
let sideKey='';
function drawSide(SW,offW){
  const key=theme+'|'+siteIdx+'|'+Math.round(SW);const sd=$('side');sd.style.width=SW+'px';sd.style.height=WD.H+'px';sd.className='th-'+theme;
  if(key===sideKey)return;sideKey=key;
  if(theme==='web'){const s=SIDE[site.id]||SIDE.news,lw=offW,rx=offW+WD.W,rw=SW-rx;
    sd.innerHTML=`<div class="sw-band"></div>${lw>80?`<div class="sw-col" style="left:14px;width:${lw-28}px"><b>SECTIONS</b>${s.l.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${rw>80?`<div class="sw-col" style="left:${rx+14}px;width:${rw-28}px"><b>TRENDING</b>${s.r.map((x,i)=>`<span><i>${i+1}</i>${x}</span>`).join('')}</div>`:''}`}
  else{sd.innerHTML=THEMES[theme].scene(Math.round(SW),WD.H);dither(null,THEMES[theme].pal,sd)}
}
// redraw the site's illustrations as small ordered-dither pixel images in the site palette
function dither(acc,tp,root){const pal=(tp||[INK,PAPER,acc,SUN,'#b9b2cc',HOT]).map(rgb);
  root.querySelectorAll('svg').forEach(svg=>{const vb=svg.viewBox.baseVal;if(!vb||!vb.width)return;const w=Math.round(vb.width/3),h=Math.round(vb.height/3),img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.className='dith';const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
      try{const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<w*h;i++){const px=i%w,py=(i/w)|0,o=(BAY[(py&3)*4+(px&3)]/16-.5)*72;let best=0,bd=1e9;
        for(let k=0;k<pal.length;k++){const q=pal[k],dr=p[i*4]+o-q[0],dg=p[i*4+1]+o-q[1],db=p[i*4+2]+o-q[2],dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;best=k}}
        p[i*4]=pal[best][0];p[i*4+1]=pal[best][1];p[i*4+2]=pal[best][2];p[i*4+3]=255}x.putImageData(d,0,0)}catch(e){}
      if(svg.isConnected)svg.replaceWith(c)};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg))})}
function fit(){
  if($('game').hidden)return;
  const availW=Math.min(innerWidth-28,LAND?1100:560),availH=innerHeight-48-32-24-62-24-34;
  scale=Math.max(.5,Math.min(availW/WD.W,availH/WD.H));
  const w=Math.round(WD.W*scale),h=Math.round(WD.H*scale),vw=LAND?Math.max(w,Math.min(availW,Math.round(h*1.6))):w,off=Math.round((vw-w)/2);
  viewport.style.width=vw+'px';viewport.style.height=h+'px';page.style.transform=`translate(${off}px,0) scale(${scale})`;
  $('bwin').style.width=(vw+4)+'px';$('dock').style.width=Math.min(innerWidth-24,Math.max(Math.min(vw+4,560),340))+'px';
  const sd=$('side');sd.hidden=!LAND;if(LAND){drawSide(vw/scale,off/scale);sd.style.transform=`scale(${scale})`}
}
addEventListener('resize',fit);

/* ---------- clutter ---------- */
const ang=e=>Math.atan2(e.s,e.c)*180/Math.PI;
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const SUBS=['SUBSCRIBE','FOLLOW +','SIGN UP','DONATE','JOIN NOW'];
const POPNAME=['newsletter.html','offer.exe','popup(1).html'];
function captions(){const n={};els.forEach(e=>{const k=n[e.t]=(n[e.t]||0);n[e.t]++;e.k=k;
  if(e.t==='popup')e.d={...site.popups[(k+idx)%site.popups.length],f:POPNAME[(k+idx)%POPNAME.length]};
  else if(e.t==='ad')e.d=ADS[(k+idx*2)%ADS.length];
  else if(e.t==='toast')e.d=TOASTS[(k+idx*3)%TOASTS.length];
  else if(e.t==='note')e.d={txt:NOTES[(k*3+idx)%NOTES.length]};
  else if(e.t==='sub')e.d={t:SUBS[k%SUBS.length]}})}
const XI=pix(P.x,{'#':INK});
function elHTML(e){
  if(theme!=='web')return THEMES[theme].el(e,e.k||0,{XI});
  const d=e.d||{};
  if(e.t==='note')return esc(d.txt);
  if(e.t==='toast')return `<span class="ti">${esc((d.t||'?')[0])}</span><span class="tw"><div class="tt2">${esc(d.t)}</div><div class="tb2">${esc(d.b)}</div></span>`;
  if(e.t==='sub')return esc(d.t);
  if(e.t==='popup')return `<div class="pp-t">${esc(d.f)}</div><button class="x-btn" aria-label="Close">${XI}</button><div class="pp-c"><div class="pp-h">${esc(d.h)}</div><div class="pp-b">${esc(d.b)}</div><div class="pp-f"><span class="pp-in">you@email.com</span><span class="pp-cta">${esc(d.cta)}</span></div><div class="pp-no">${esc(d.no)}</div></div>`;
  if(e.t==='ad')return `<span class="al">AD</span><button class="x-btn" aria-label="Close ad">${XI}</button><div class="ar"><span class="ath">${esc(d.s[0])}</span><span><div class="ah">${esc(d.h)}</div><div class="as">${esc(d.s)} · sponsored</div></span></div>`;
  if(e.t==='cookie')return `<div class="ck-t"><b>COOKIES?*</b>We and our 847 partners would like to follow you around the internet forever. *mandatory</div><div class="ck-b"><button class="accept">ACCEPT ALL</button><span class="ck-m">manage options</span></div>`;
  return '';
}
function build(){
  captions();elsBox.innerHTML='';views=[];
  els.forEach((e,i)=>{
    const v=document.createElement('div');v.dataset.i=i;
    if(e.t==='chat'){
      const P2=S.PANEL;v.className='el chat'+(e.open?' open':'');

function toPage(e){const r=page.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale]}

function ext(e){const hw=e.w/2,hh=e.h/2,c=Math.abs(e.c),s=Math.abs(e.s);return[hw*c+hh*s,hw*s+hh*c]}
function hitsBox(e,b,p){const[ex,ey]=ext(e);return e.x+ex>b.x-p&&e.x-ex<b.x+b.w+p&&e.y+ey>b.y-p&&e.y-ey<b.y+b.h+p}
let drag=null;
viewport.addEventListener('pointerdown',ev=>{
  A();if(demo)return;const v=ev.target.closest('.el');if(!v)return;const i=+v.dataset.i,e=els[i];if(e.gone)return;
  if(ev.target.closest('.x-btn')){ev.preventDefault();if(!canAct())return;e.gone=true;retrigger(v,e.t==='ad'?'shrink':'fold');sfx.thwip();setTimeout(()=>v.style.visibility='hidden',320);spend(ICON.close);return}

  if(!DRAGGABLE.has(e.t)||running||won)return;
  ev.preventDefault();
  if(used>=MAX_ACTIONS){canAct();return}
  const p=toPage(ev);drag={i,v,e,ox:e.x-p[0],oy:e.y-p[1],x0:e.x,y0:e.y,lastX:p[0],lastT:performance.now(),tilt:0,moved:false};
  try{viewport.setPointerCapture(ev.pointerId)}catch(_){}

viewport.addEventListener('pointermove',ev=>{
  if(!drag)return;const p=toPage(ev),d=drag,e=d.e,[ex,ey]=ext(e);
  e.x=Math.min(WD.W-ex,Math.max(ex,p[0]+d.ox));e.y=Math.min(WD.H-ey,Math.max(34+ey,p[1]+d.oy));
  if(Math.hypot(e.x-d.x0,e.y-d.y0)>6)d.moved=true;
  const now=performance.now(),vx=(p[0]-d.lastX)/Math.max(8,now-d.lastT);d.lastX=p[0];d.lastT=now;
  d.tilt+=(Math.max(-12,Math.min(12,vx*22))-d.tilt)*.35;
  place(d.v,e);d.v.firstChild.style.transform=`rotate(${d.tilt.toFixed(1)}deg) translate(-3px,-3px)`;
});
function endDrag(){
  if(!drag)return;const d=drag,e=d.e,v=d.v;drag=null;
  v.classList.remove('drag');v.firstChild.style.transform='';
  if(!d.moved){e.x=d.x0;e.y=d.y0;place(v,e);return}
  if(hitsBox(e,START_BOX,5)||hitsBox(e,WD.GOAL,3)){   // 1px more lenient than the generator, so every designed spot is accepted
    e.x=d.x0;e.y=d.y0;v.classList.add('back');place(v,e);sfx.deny();status("Can't cover the ball or the new tab");return}
  e.x=Math.round(e.x*10)/10;e.y=Math.round(e.y*10)/10;place(v,e);
  retrigger(v,'drop');sfx.drop();spend(ICON[e.t]);

/* ---------- pixel ball, trail, confetti (drawn at half resolution) ---------- */
const BALL=(()=>{const c=document.createElement('canvas');c.width=c.height=11;const x=c.getContext('2d');
  for(let j=0;j<11;j++)for(let i=0;i<11;i++){const d=Math.hypot(i-5,j-5);if(d>5.4)continue;x.fillStyle=d>4.3?INK:((i===3&&j===3)||(i===4&&j===3)||(i===3&&j===4))?'#fff':HOT;x.fillRect(i,j,1,1)}return c})();
const COINF=[4.6,3.4,1.4,3.4].map(a=>{const c=document.createElement('canvas');c.width=c.height=9;const x=c.getContext('2d');
  for(let j=0;j<9;j++)for(let i=0;i<9;i++){const u=(i-4)/a,v=(j-4)/4.6,d=u*u+v*v;if(d>1.05)continue;const edge=((i-4)/(a-1))**2+((j-4)/3.6)**2>1||a<2;
    x.fillStyle=edge?INK:(i===3&&j<=4&&a>3)?'#fff':SUN;x.fillRect(i,j,1,1)}return c});
let ball={x:WD.START.x,y:WD.START.y},trail=[],particles=[],sim=null,acc=0,lastT=0,squash=0;
const H2=v=>Math.round(v/2);
function draw(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  // launch pad under the start
  ctx.fillStyle=INK;ctx.fillRect(H2(WD.START.x)-6,H2(WD.START.y)+6,13,2);ctx.fillRect(H2(WD.START.x)-5,H2(WD.START.y)+8,2,3);ctx.fillRect(H2(WD.START.x)+3,H2(WD.START.y)+8,2,3);
  if(level)level.coins.forEach((c,i)=>{if(gotMask>>i&1)return;const f=COINF[Math.floor(t/130+i*1.7)%4];ctx.drawImage(f,H2(c[0])-4,H2(c[1])-4)});
  for(let k=0;k<trail.length;k++){const p=trail[k];ctx.globalAlpha=(k+1)/trail.length*.6;ctx.fillStyle=k%2?HOT:SUN;ctx.fillRect(H2(p[0])-1,H2(p[1])-1,2,2)}
  ctx.globalAlpha=1;
  let bx=ball.x,by=ball.y;
  if(!running&&!won){by+=Math.round(Math.sin(t/220))*2;
    if(elsBox.classList.contains('reveal')){const L=Math.hypot(WD.LAUNCH.vx,WD.LAUNCH.vy);ctx.fillStyle=HOT;for(let k=8;k<=20;k+=3)ctx.fillRect(H2(bx+WD.LAUNCH.vx/L*k*2)-0,H2(by+WD.LAUNCH.vy/L*k*2),2,2)}}
  const sq=1+squash*.4,w=Math.round(11*sq),h=Math.round(11/sq);
  ctx.drawImage(BALL,H2(bx)-(w>>1),H2(by)-(h>>1),w,h);squash*=.82;
  for(const p of particles){ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.fillStyle=p.c;ctx.fillRect(H2(p.x),H2(p.y),2,p.r>3?1:2)}
  ctx.globalAlpha=1;
}
function tick(t){
  const dt=Math.min(.05,(t-(lastT||t))/1000);lastT=t;
  if(running&&sim){
    acc+=dt;let n=0;
    while(acc>=S.DT&&!sim.done&&n<60){S.step(sim);acc-=S.DT;n++;
      for(const h of sim.hits)onHit(h);
      for(const i of sim.gotNow)gotCoin(i);
      if(sim.n%5===0){trail.push([sim.x,sim.y]);if(trail.length>18)trail.shift()}}
    ball={x:sim.x,y:sim.y};
    if(sim.done)finish(sim.done);
  }
  for(const p of particles){p.vy+=600*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r=(p.r+dt*12)%6;p.life-=dt*.7}
  particles=particles.filter(p=>p.life>0);
  if(!$('game').hidden)draw(t);
  requestAnimationFrame(tick);
}
function gotCoin(i){gotMask|=1<<i;const c=level.coins[i],n=pc(gotMask);sfx.coin(n);coinCt(true);
  for(let k=0;k<10;k++){const a=k/10*Math.PI*2;particles.push({x:c[0],y:c[1],vx:Math.cos(a)*140,vy:Math.sin(a)*140-80,r:Math.random()*6,c:k%2?SUN:'#fff',life:.55})}

let lastHit={};
function onHit(h){
  const e=els[h.id],v=views[h.id];if(!v)return;squash=Math.min(1,h.v/700);

  else{sfx.thock(e.t==='chat'&&e.open?'panel':e.t,h.v);if(e.t!=='chat')retrigger(v,'wob')}
}

const FAIL={fell:'404 · ball not found',stalled:'ball is buffering…',timeout:'request timed out'};

  const perfect=res==='win'&&got===N,msg=res==='win'?(perfect?'perfect run · every coin':`tab reached · ${got*100} pts`):FAIL[res]+` · ${got}/${N} coins`;

    const left=DAILY_LAUNCHES-launches;
    if(perfect||left<=0){dayDone=true;won=true;finalizeDay()}

  m.querySelectorAll('.arow').forEach(b=>b.onclick=()=>load('archive',{day:+b.dataset.d}));
}

/* ---------- countdown & optional global stats ---------- */
function tickCd(){const n=new Date(),ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n,s=Math.max(0,Math.floor(ms/1000));
  const t=dayNum()!==num?'READY · REFRESH':[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':');document.querySelectorAll('.cd').forEach(e=>e.textContent=t)}
setInterval(tickCd,1000);
function postScore(){if(!STATS_API)return;try{fetch(STATS_API+'/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({day:num,k:best,n:level.coins.length})}).catch(()=>{})}catch(e){}}
async function getGlobal(){if(!STATS_API)return null;try{return await (await fetch(STATS_API+'/stats?day='+num)).json()}catch(e){return null}}
async function globalLine(el,k){const g=await getGlobal();if(!g||!g.players||!el)return;let below=0,ties=0;
  for(const [kk,v] of Object.entries(g.hist||{})){if(+kk<k)below+=v;else if(+kk===k)ties+=v}
  el.innerHTML=`<b>${g.players.toLocaleString()}</b> played today · avg <b>${g.avg}</b> pts · <b>${g.perfectPct}%</b> perfect<br>you beat <b>${Math.round(100*(below+ties/2)/g.players)}%</b> of players`}
async function globalCount(){const g=await getGlobal();$('hPlayers').textContent=g&&g.players?`● ${g.players.toLocaleString()} PLAYED TODAY`:''}
async function share(text){
  try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);flashBtn('COPIED ✓')}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flashBtn('COPIED ✓')}catch(_){flashBtn('COPY FAILED')}ta.remove()}
}
function flashBtn(t){const b=$('share');if(!b)return;b.textContent=t;setTimeout(()=>{if($('share'))$('share').textContent='SHARE ↗'},1600)}
function practice(){load('practice',{idx:Math.floor(Math.random()*LEVELS.length),theme:ORDER[Math.floor(Math.random()*ORDER.length)],site:Math.floor(Math.random()*SITES.length)})}

const setMute=()=>{$('mute').innerHTML=pix(muted?P.mute:P.snd,{'#':INK})};setMute();
$('mute').onclick=()=>{muted=!muted;setMute();try{localStorage.setItem('th-muted',muted?'1':'0')}catch(e){}};
$('menuBtn').onclick=()=>{$('menu').hidden=!$('menu').hidden};
$('menu').onclick=e=>{const g=e.target.dataset.go;if(!g)return;$('menu').hidden=true;
  if(g==='home'){show('home');homeCard()}else if(g==='daily')load('daily');else if(g==='practice')practice();else if(g==='stats')statsModal();else if(g==='archive')archive();else readme()};

$('topNum').textContent=DAYTXT;
$('openBtn').onclick=()=>load('daily');
$('practiceBtn').onclick=practice;$('statsBtn').onclick=statsModal;$('archiveBtn').onclick=archive;
$('howBtn').onclick=readme;
$('launch').onclick=launch;
$('reset').onclick=()=>{if(!running){$('modal').hidden=true;reset(false);sfx.thwip()}};
$('eye').onclick=()=>{revealOn=!revealOn;elsBox.classList.toggle('reveal',revealOn);$('eye').classList.toggle('on',revealOn)};

if(!LEVELS.length){$('hHost').textContent='levels.js is missing'}
else{homeCard();const q=parseInt(new URLSearchParams(location.search).get('level'),10);
  if(q>=1&&q<=LEVELS.length){store.set('th-readme',1);load('practice',{idx:q-1,theme:'web',site:0})}}
requestAnimationFrame(tick);
if(document.fonts)document.fonts.ready.then(fit);
window.__th={get mode(){return mode},get launches(){return launches},get best(){return best},get dayDone(){return dayDone},get els(){return els},get level(){return level},get scale(){return scale},get won(){return won},get used(){return used}};
})();
